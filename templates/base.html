<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaxisFast{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
        }
        header {
            background-color: #ffcc00;
            padding: 15px 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0 0 8px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        nav a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
        }
        nav a:hover { background-color: #333; color: #ffcc00; }
        main {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #333; color: #ffcc00; }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; font-weight: bold; margin-bottom: 4px; }
        .campo input, .campo select, .campo textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .errores { color: #c0392b; margin: 4px 0 0 0; }
        button, .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover, .btn:hover { background-color: #ffcc00; color: #333; }
        .resumen span { display: inline-block; margin-right: 20px; font-weight: bold; }
        footer { text-align: center; color: #888; padding-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>TaxisFast</h1>
        <nav>
            <a href="{% url 'taxis:home' %}">Flota</a>
            <a href="{% url 'taxis:taxi_create' %}">Nuevo taxi</a>
            <a href="{% url 'taxis:lineas_lista' %}">Líneas</a>
            <a href="{% url 'taxis:linea_create' %}">Nueva línea</a>
            <a href="{% url 'taxis:sobre_nosotros' %}">Sobre nosotros</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 TaxisFast</p>
    </footer>

</body>
</html>
