<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login</title>
</head>
<body>
    <h1>Control de Acceso</h1>
    <h2> Sistema de Gestión de Biblioteca</h2>
    {% if form.errors %}
        <p style="color: red;">Nombre de usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Iniciar Sesión</button> 

    </form>
</body>
</html>
